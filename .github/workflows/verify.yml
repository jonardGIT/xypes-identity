name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            xypes-identity-engine/package-lock.json
            xypes-identity-sdk/package-lock.json
            xypes-identity-admin/package-lock.json

      - name: Run workspace verification
        shell: bash
        run: bash scripts/linux/verify-all.sh